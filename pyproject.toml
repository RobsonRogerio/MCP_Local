[project]
name = "mcps"
version = "0.1.0"
description = "Exemplos de servidores e clientes MCP (local, remoto, Wikipedia e OpenWeather) usando FastMCP"
readme = "README.md"
authors = [
    { name = "RobsonRogerio", email = "robson.rogerio@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.2.0",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "wikipedia>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

# Por padrão o uv_build procura um módulo com o nome do projeto (src/mcps/).
# Como o módulo do pacote continua sendo src/mcp_local/, indicamos o nome aqui.
[tool.uv.build-backend]
module-name = "mcp_local"
